name: Flagship comparison proof

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  proof:
    name: Flagship ${{ matrix.scenario }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scenario: [control, regression, threshold]
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      WEIGHIN_EXPERIMENT_RPC_URL: http://localhost:8000/rpc
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: '1.95.0'
          targets: wasm32v1-none
      - name: Fetch locked native helper crates
        run: cargo +1.95.0 fetch --locked --manifest-path native/simulation/Cargo.toml
      - name: Install dependencies and validate source
        run: |
          npm ci
          npm test
          npm run test:native
          npm run build
          npm run bundle
          git diff --exit-code -- bundled/index.js
          npm pack --dry-run --json
      - name: Install checksum-verified Stellar CLI
        run: |
          curl -fsSL https://github.com/stellar/stellar-cli/releases/download/v28.1.0/stellar-cli-28.1.0-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/stellar-cli.tar.gz"
          echo "c1680deee94301d33ada7a17f98411e642a4248c727afbd2e43050d345746462  $RUNNER_TEMP/stellar-cli.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/stellar-cli"
          tar -xzf "$RUNNER_TEMP/stellar-cli.tar.gz" -C "$RUNNER_TEMP/stellar-cli"
          echo "$RUNNER_TEMP/stellar-cli" >> "$GITHUB_PATH"
      - name: Start pinned standalone network
        run: bash scripts/start-local-network.sh
      - name: Execute real bundled Action on isolated revisions
        id: benchmark
        continue-on-error: ${{ matrix.scenario == 'threshold' }}
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: node tests/experiments/verify-flagship-ci.cjs "$SCENARIO" "$RUNNER_TEMP/weighin-flagship-evidence"
      - name: Require verified result and genuine policy failure
        if: ${{ !cancelled() }}
        env:
          SCENARIO: ${{ matrix.scenario }}
          BENCHMARK_OUTCOME: ${{ steps.benchmark.outcome }}
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          assert.equal(fs.existsSync(path.join(process.env.RUNNER_TEMP, 'weighin-flagship-evidence/failure.json')), false);
          const proof = require(path.join(process.env.RUNNER_TEMP, 'weighin-flagship-evidence/verification.json'));
          assert.equal(proof.status, 'VERIFIED');
          assert.equal(proof.scenario, process.env.SCENARIO);
          assert.equal(proof.action_exit, process.env.SCENARIO === 'threshold' ? 1 : 0);
          assert.equal(process.env.BENCHMARK_OUTCOME, process.env.SCENARIO === 'threshold' ? 'failure' : 'success');
          NODE
      - name: Retain reports, source, WASM and raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flagship-${{ matrix.scenario }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/weighin-flagship-evidence
          if-no-files-found: error
          retention-days: 30
      - name: Stop owned sidecar
        if: always()
        run: |
          if docker ps -q -f name=^/stellar-quickstart$ -f label=io.weighin.managed-by=weighin-start-local-network | grep -q .; then
            docker stop stellar-quickstart
          fi
